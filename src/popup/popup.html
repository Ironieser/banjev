<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BanJev</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../../icons/48.png" alt="">
    <strong>BanJev</strong>
    <a class="ext" href="https://ironieser.github.io/banjev/" target="_blank">Ranking ↗</a>
  </header>

  <section>
    <h2>On this page</h2>
    <div id="page" class="muted">Loading…</div>
  </section>

  <section class="opts">
    <label><input type="checkbox" id="enabled"> Enabled</label>
    <label title="On arXiv, also tag banned names without extra evidence (dashed BanJev?). Google Scholar always requires evidence."><input type="checkbox" id="showNameMatches"> arXiv: show name-only matches (faded logo)</label>
  </section>

  <details id="fp" hidden>
    <summary>People you marked "not this person" (<span id="fpCount">0</span>)</summary>
    <ul id="fpList"></ul>
  </details>

  <footer>
    <div><span id="stats"></span> · <span id="updated"></span> <button id="refresh" title="Fetch the latest list from GitHub">Update</button></div>
    <div><a class="ext" href="https://github.com/Ironieser/banjev/blob/main/data/manual.json" target="_blank">Wrong person or paper? Edit the list ↗</a></div>
  </footer>
  <script src="../lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
