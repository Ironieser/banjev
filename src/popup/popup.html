<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BanJev</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>BanJev</strong>
    <span id="stats" class="muted"></span>
    <a id="ranking" href="https://ironieser.github.io/banjev/" target="_blank">Ranking ↗</a>
  </header>
  <section class="opts">
    <label><input type="checkbox" id="enabled"> Enabled</label>
    <label title="On arXiv, tag banned names even without extra evidence (dashed BanJev?). Google Scholar always requires evidence."><input type="checkbox" id="showNameMatches"> arXiv: show name-only matches (BanJev?)</label>
  </section>
  <section class="row">
    <button id="refresh">Update list now</button>
    <span id="updated" class="muted"></span>
  </section>
  <input id="filter" type="search" placeholder="Filter papers / authors">
  <ul id="papers"></ul>
  <details id="fp">
    <summary>False positives you marked (<span id="fpCount">0</span>)</summary>
    <ul id="fpList"></ul>
  </details>
  <script src="../lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
